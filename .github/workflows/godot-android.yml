name: Godot Android Export
on:
  workflow_dispatch:
    inputs:
      git_url:
        description: 'Git URL of the Godot project'
        required: true
      godot_version:
        description: 'Godot version (e.g. 4.2.2, 3.5.3)'
        default: '4.2.2'
        required: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone target project
        run: |
          git clone "${{ github.event.inputs.git_url }}" target_project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "platforms;android-28"

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkey -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Download Godot
        run: |
          VERSION=${{ github.event.inputs.godot_version }}
          if [[ "${VERSION}" == 4.* ]]; then
            FILENAME="Godot_v${VERSION}-stable_linux.x86_64"
          else
            FILENAME="Godot_v${VERSION}-stable_x11.64"
          fi
          wget "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/${FILENAME}.zip"
          unzip "${FILENAME}.zip"
          mv "${FILENAME}" godot.x86_64
          chmod +x godot.x86_64

      - name: Install Godot Export Templates
        run: |
          VERSION=${{ github.event.inputs.godot_version }}
          wget "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"
          
          if [[ "${VERSION}" == 4.* ]]; then
            TEMPLATE_PATH="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          else
            TEMPLATE_PATH="$HOME/.local/share/godot/templates/${VERSION}.stable"
          fi
          
          mkdir -p "$TEMPLATE_PATH"
          unzip "Godot_v${VERSION}-stable_export_templates.tpz" -d templates_temp
          mv templates_temp/templates/* "$TEMPLATE_PATH"
          rm -rf templates_temp "Godot_v${VERSION}-stable_export_templates.tpz"

      - name: Configure Godot Editor Settings
        run: |
          VERSION=${{ github.event.inputs.godot_version }}
          mkdir -p ~/.config/godot
          
          # Create both Godot 3 and 4 settings just in case
          
          # Godot 4
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

          # Godot 3
          cat <<EOF > ~/.config/godot/editor_settings-3.tres
[gd_resource type="EditorSettings" format=2]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

      - name: Export Android
        run: |
          mkdir -p target_project/build/android
          VERSION=${{ github.event.inputs.godot_version }}
          
          # Check if export_presets.cfg exists, if not create a default one
          if [ ! -f target_project/export_presets.cfg ]; then
            echo "Creating default export_presets.cfg"
            if [[ "${VERSION}" == 4.* ]]; then
              cat <<EOF > target_project/export_presets.cfg
[preset.0]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
export_path="build/android/project.apk"
[preset.0.options]
architecture/armeabi-v7a=true
architecture/arm64-v8a=true
package/unique_name="org.godotengine.export"
package/name="GodotExport"
EOF
            else
              cat <<EOF > target_project/export_presets.cfg
[preset.0]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
export_path="build/android/project.apk"
[preset.0.options]
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
package/unique_name="org.godotengine.export"
package/name="GodotExport"
EOF
            fi
          fi

          if [[ "${VERSION}" == 4.* ]]; then
            ./godot.x86_64 --headless --path target_project --export-release "Android" build/android/project.apk
          else
            ./godot.x86_64 --no-window --path target_project --export-release "Android" build/android/project.apk
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target_project/build/android/*.apk
